<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2EEE6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181816" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Receipt upload</title>
  <link rel="manifest" href="/upload.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="css/upload.css">
</head>
<body>
  <main class="up">
    <h1>Receipt to fridge</h1>
    <p class="up-hint">Photograph the receipt flat and well lit. Check every line before you confirm.</p>

    <div class="up-entry">
      <button id="take" class="up-btn up-btn--main" type="button">Take photo</button>
      <button id="choose" class="up-btn" type="button">Choose image</button>
      <button id="manual" class="up-btn" type="button">Enter by hand</button>
    </div>
    <input id="photo" type="file" accept="image/*" capture="environment" hidden>
    <input id="pick" type="file" accept="image/*" hidden>

    <progress id="prog" class="up-prog" max="1" hidden aria-label="Reading progress"></progress>
    <p id="status" class="up-msg" role="status" hidden></p>
    <p id="warn" class="up-msg" data-kind="warn" hidden></p>
    <details id="raw" class="up-raw" hidden>
      <summary>Scanned text</summary>
      <pre></pre>
    </details>

    <form id="review" hidden>
      <h2>Check the lines</h2>
      <label class="up-date">Purchase date <input id="date" type="date" required enterkeyhint="next"></label>
      <ul id="rows" class="up-rows"></ul>
      <button id="add" class="up-btn" type="button">Add line</button>
      <div class="up-bar">
        <div id="sendbox" class="up-msg" role="status" hidden>
          <span id="sendtxt"></span>
          <button id="undo" class="up-link" type="button" hidden>Undo</button>
        </div>
        <div class="up-bar-row">
          <button id="discard" class="up-btn" type="button">Discard</button>
          <button id="confirm" class="up-btn up-btn--main" type="submit">Confirm to fridge</button>
        </div>
      </div>
    </form>
  </main>
  <script type="module" src="js/upload.js"></script>
</body>
</html>
